name: CI

# PRs: fast secretless checks, plus the 3-image build (push pr-<n>) for
# same-repo PRs. Fork PRs get checks only — /build (build-pr.yml) is their sole
# image path. Merge to main / manual: additionally runs the full e2e
# suite, which GATES the image push, then release + demo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Collapse redundant runs on rapid pushes to the same ref. Never cancel a main
# run mid-flight — it builds + releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Integration tiers — main / manual only (they need Docker, k3d, a real
  # tailnet). Skipped on PRs; a skip satisfies `build`'s needs. On main a red
  # tier blocks the image.
  e2e:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  build:
    needs: [test, e2e]
    # Fork PRs skip build entirely — /build (build-pr.yml) is their only image
    # path. On push, github.event.pull_request is null → guard is true.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write

  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/demo.yml
    permissions:
      contents: read
      pages: write
      id-token: write
