# This file provides one shared MinIO for local dev and the `mc` integration tests; in production the manager launches a separate MinIO + tailscaled per friend at runtime.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: p0rtadmin
      MINIO_ROOT_PASSWORD: p0rtadmin123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  manager:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      P0RT1ON_DB_PATH: /data/p0rt1on.db
      P0RT1ON_PORT: "8080"
      # The pantry path must be identical inside the manager and on the host (matching the bind mount below), so the manager's mkdir and the instances' host-daemon bind mounts resolve to the same directory.
      P0RT1ON_PANTRY: ${P0RT1ON_PANTRY:-/srv/p0rt1on}
      # The manager reaches instances by container name over the shared docker network, because on Linux their loopback-published ports (including host.docker.internal) are unreachable cross-container.
      P0RT1ON_INSTANCE_ADDRESSING: network
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - manager-data:/data
      - ${P0RT1ON_PANTRY:-/srv/p0rt1on}:${P0RT1ON_PANTRY:-/srv/p0rt1on}
    networks:
      - default
      - p0rt1on-net
    depends_on:
      - minio

networks:
  # p0rt1on-net is the network instances join (DOCKER_NETWORK in DockerRuntime.ts); since it's external, create it out-of-band first: `docker network create p0rt1on-net`.
  p0rt1on-net:
    external: true

volumes:
  minio-data:
  manager-data:
