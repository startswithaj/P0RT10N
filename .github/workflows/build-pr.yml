# On-demand PR image via a maintainer commenting /build on a PR.
#
# Exists for FORK PRs: ci.yml skips build on fork PRs (their token is
# read-only), so a maintainer triggers this instead. It runs with this repo's
# token, builds the PR's HEAD commit, and pushes pr-<n> for all 3 images.
name: build-pr

on:
  issue_comment:
    types: [created]

env:
  REGISTRY: ghcr.io

jobs:
  authorize:
    name: authorize /build
    if: github.event.issue.pull_request && github.event.comment.body == '/build'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      number: ${{ steps.pr.outputs.number }}
      comment_id: ${{ steps.ack.outputs.comment_id }}
      run_url: ${{ steps.ack.outputs.run_url }}
    steps:
      - name: Require write access for commenter
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`@${context.actor} does not have write access`);
            }

      - name: Acknowledge with rocket and status comment
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Building images — [view run](${runUrl})`,
            });
            core.setOutput('comment_id', comment.id);
            core.setOutput('run_url', runUrl);

      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);
            core.setOutput('number', pr.number);

  build:
    name: build & push ${{ matrix.name }} (pr-${{ needs.authorize.outputs.number }})
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manager, context: . }
          - { name: instance, context: instance }
          - { name: backup-client, context: backup-client }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/p0rt1on-${{ matrix.name }}
          tags: |
            type=raw,value=pr-${{ needs.authorize.outputs.number }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.authorize.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

  report:
    name: report result
    needs: [authorize, build]
    if: always() && needs.authorize.outputs.comment_id
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ needs.build.result }}' === 'success';
            const runUrl = '${{ needs.authorize.outputs.run_url }}';
            const n = '${{ needs.authorize.outputs.number }}';
            const base =
              `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const images = ['manager', 'instance', 'backup-client']
              .map((i) => `\`${base}/p0rt1on-${i}:pr-${n}\``)
              .join(', ');
            const body = ok
              ? `✅ Pushed ${images} — [view run](${runUrl})`
              : `❌ Build failed — [view run](${runUrl})`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.authorize.outputs.comment_id }},
              body,
            });
