# p0rt1on manager. Runs the Deno app with bundled `mc` + docker CLIs, and
# launches the combined instance containers against the host's Docker daemon
# (socket mounted). Instances publish their MinIO port to the host; the manager
# reaches them at host.docker.internal:<port>, and they POST the audit webhook
# back to the manager the same way.
#
# Needs a .env with at least P0RT1ON_MASTER_KEY, TAILSCALE_OAUTH_CLIENT_SECRET,
# and TAILNET_DOMAIN.
# On Docker Desktop this works as-is (host.docker.internal routes to the host).
# On Linux, keep the extra_hosts line (adds host-gateway) and note that the
# manager reaching an instance's 127.0.0.1-published port may require running the
# manager on the host instead, or publishing instance ports on 0.0.0.0.
services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile.dev # dev image: also runs the Vite dev server
    env_file: .env
    # Root so it can use the mounted docker socket + write the volumes.
    user: root
    environment:
      # Container overrides (the app's own defaults suit host-run dev).
      # The admin API binds loopback unconditionally; only the dedicated
      # audit-webhook listener (AUDIT_PORT) faces the container network.
      INSTANCE_HOST: "host.docker.internal" # reach instances' published ports
      AUDIT_WEBHOOK_URL: "http://host.docker.internal:8081/internal/audit"
      DB_PATH: "/app/data/p0rt1on.db"
    ports:
      - "127.0.0.1:8080:8080" # admin API — loopback only (Vite proxies here)
      - "8081:8081" # audit webhook — instances POST via the host gateway
      - "127.0.0.1:5173:5173" # Vite dev server (frontend) — open this in a browser
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # launch instance containers
      - .:/app # live source (repo root = build context) — restart picks up code changes
      - p0rt1on-db:/app/data # metadata DB
      - p0rt1on-mc:/root/.mc # mc aliases (per-instance admin creds)
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host on Linux
    restart: unless-stopped

volumes:
  p0rt1on-db:
  p0rt1on-mc:
