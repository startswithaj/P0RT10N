# p0rt1on on Kubernetes — everything lives in ONE namespace; the manager's
# ServiceAccount has a single namespace-scoped Role (least privilege). PSA
# `restricted` is enforced on the namespace: instance pods run userspace
# tailscaled (TS_USERSPACE=true), so nothing needs capabilities or devices —
# the cluster itself refuses privileged pods, even from a compromised manager.
#
#   kubectl apply -f deploy/k8s/pantry.yaml    # the portion-data StorageClass
#   kubectl apply -f deploy/k8s/p0rt1on.yaml
#
# Prereqs: build/push the manager + instance images somewhere the cluster can
# pull; fill in the `p0rt1on-manager-secrets` Secret below (master key, OAuth
# client secret, tag owner, tailnet domain); apply deploy/k8s/pantry.yaml for
# the `p0rt1on-pantry` StorageClass that portion DATA is provisioned from
# (P0RT1ON_PANTRY below). The manager's own PVC deliberately does NOT use that
# class — the pantry holds friend data only.
apiVersion: v1
kind: Namespace
metadata:
  name: p0rt1on
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
---
# The manager's ENTIRE permission surface. Nothing cluster-scoped; it cannot
# escalate itself (no RBAC verbs) and is powerless outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p0rt1on-manager
subjects:
  - kind: ServiceAccount
    name: p0rt1on-manager
    namespace: p0rt1on
---
# Fill in before applying (or create via kubectl create secret).
apiVersion: v1
kind: Secret
metadata:
  name: p0rt1on-manager-secrets
  namespace: p0rt1on
stringData:
  P0RT1ON_MASTER_KEY: "CHANGE-ME"
  P0RT1ON_TAILSCALE_OAUTH_CLIENT_SECRET: "CHANGE-ME"
  P0RT1ON_TAILSCALE_TAG_OWNER: "tag:p0rt1on"
  P0RT1ON_TAILSCALE_TAILNET_DOMAIN: "CHANGE-ME"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p0rt1on-manager-data
  namespace: p0rt1on
spec:
  # No storageClassName: the manager's DB uses the cluster default, never the
  # pantry — the pantry is friend data only, with a different lifecycle.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
spec:
  replicas: 1
  selector:
    matchLabels: { app: p0rt1on-manager }
  template:
    metadata:
      labels: { app: p0rt1on-manager }
    spec:
      serviceAccountName: p0rt1on-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: p0rt1on-manager:latest # pin before production use
          envFrom:
            - secretRef: { name: p0rt1on-manager-secrets }
          env:
            - name: P0RT1ON_RUNTIME
              value: kubernetes
            - name: P0RT1ON_K8S_NAMESPACE
              value: p0rt1on
            # The pantry: the StorageClass every portion's DATA PVC is
            # provisioned from (deploy/k8s/pantry.yaml). Tailscale state uses the
            # cluster default, so it stays off the pantry.
            - name: P0RT1ON_PANTRY
              value: p0rt1on-pantry
            - name: P0RT1ON_DB_PATH
              value: /data/p0rt1on.db
            # Trust the cluster CA for API calls (Deno reads this PEM).
            - name: DENO_CERT
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            - containerPort: 8080 # admin UI/API (loopback-only by design;
            # reach it via `kubectl port-forward` — do NOT expose it)
            - containerPort: 8081 # audit webhook listener
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: p0rt1on-manager-data }
---
apiVersion: v1
kind: Service
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
spec:
  selector: { app: p0rt1on-manager }
  ports:
    - name: audit
      port: 8081
      targetPort: 8081
