# p0rt1on manager — SHARED base config. This file does NOT run on its own (it
# has no build target); combine it with exactly one overlay:
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# The manager launches the combined instance containers against the host's
# Docker daemon (socket mounted). Because it is itself a container, it reaches
# each instance's MinIO admin plane by CONTAINER NAME over the shared
# `p0rt1on-net` network (P0RT1ON_INSTANCE_ADDRESSING=network) — a loopback-
# published port is unreachable from another container. Instances POST the audit
# webhook back via the host gateway.
#
# The p0rt1on-net network is created out-of-band (shared with the instances the
# manager launches over the docker socket):
#   docker network create p0rt1on-net
#
# Needs a .env with at least P0RT1ON_MASTER_KEY and
# P0RT1ON_TAILSCALE_OAUTH_CLIENT_SECRET.
services:
  manager:
    env_file: .env
    # Root so it can use the mounted docker socket + write the volumes.
    user: root
    environment:
      # Reach instances by container name over p0rt1on-net (see networks below).
      P0RT1ON_INSTANCE_ADDRESSING: "network"
      P0RT1ON_DB_PATH: "/app/data/p0rt1on.db"
      # Forward every MinIO event to your own webhook (optional, byte-identical):
      # P0RT1ON_MINIO_FORWARD_URL: "https://example.com/minio-events"
      # P0RT1ON_MINIO_FORWARD_AUTHORIZATION: "Bearer your-token"
    ports:
      # Manager admin surface: prod serves the SPA here from Deno; dev's Vite
      # dev server proxies to it. Loopback-only on the host.
      - "127.0.0.1:8080:8080"
      - "8081:8081" # audit webhook — instances POST via the host gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # launch instance containers
      - p0rt1on-db:/app/data # metadata DB
      - p0rt1on-mc:/root/.mc # mc aliases (per-instance admin creds)
      # The pantry, bind-mounted at the SAME path inside the manager as on the
      # host: the manager creates each friend's directory here, and the instance
      # containers (launched on the host daemon) bind-mount the same host path —
      # they must resolve to identical bytes. Set P0RT1ON_PANTRY in .env.
      - ${P0RT1ON_PANTRY:-/srv/p0rt1on}:${P0RT1ON_PANTRY:-/srv/p0rt1on}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host on Linux
    networks:
      - default # keep host-published admin/audit ports
      - p0rt1on-net # resolve p0rt1on-instance-<host> by container name
    restart: unless-stopped

volumes:
  p0rt1on-db:
  p0rt1on-mc:

networks:
  # The network instances join (DOCKER_NETWORK in DockerRuntime.ts). Created
  # out-of-band:
  #   docker network create p0rt1on-net
  p0rt1on-net:
    external: true
