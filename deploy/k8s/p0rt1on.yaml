# The manager's ServiceAccount has a single namespace-scoped Role (least privilege); PSA `restricted` is enforced so instance pods (userspace tailscaled) need no capabilities or devices, and the cluster refuses privileged pods even from a compromised manager.
apiVersion: v1
kind: Namespace
metadata:
  name: p0rt1on
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
---
# This Role is the manager's primary permission surface: no RBAC verbs to
# self-escalate, and no access to other namespaces' resources. Two narrow,
# read-only, cluster-scoped exceptions exist below (ClusterRole
# p0rt1on-manager-preflight) purely for boot-time health checks: reading the
# pantry StorageClass and the manager's own namespace's PSA label. Neither
# grants pods:list or any other cluster-wide resource read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p0rt1on-manager
subjects:
  - kind: ServiceAccount
    name: p0rt1on-manager
    namespace: p0rt1on
---
apiVersion: v1
kind: Secret
metadata:
  name: p0rt1on-manager-secrets
  namespace: p0rt1on
stringData:
  P0RT1ON_MASTER_KEY: "CHANGE-ME"
  P0RT1ON_TAILSCALE_OAUTH_CLIENT_SECRET: "CHANGE-ME"
  P0RT1ON_TAILSCALE_TAG_OWNER: "tag:p0rt1on"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p0rt1on-manager-data
  namespace: p0rt1on
spec:
  # No storageClassName here: the manager's DB uses the cluster default, never the pantry, because the pantry is friend data only with a different lifecycle.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
spec:
  replicas: 1
  selector:
    matchLabels: { app: p0rt1on-manager }
  template:
    metadata:
      labels: { app: p0rt1on-manager }
    spec:
      serviceAccountName: p0rt1on-manager
      securityContext:
        runAsNonRoot: true
        # runAsUser 1993 matches the image's `deno` user; fsGroup makes the mounted /data PVC writable for it.
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: p0rt1on-manager:latest # Pin this image tag before production use.
          envFrom:
            - secretRef: { name: p0rt1on-manager-secrets }
          env:
            - name: P0RT1ON_RUNTIME
              value: kubernetes
            - name: P0RT1ON_K8S_NAMESPACE
              value: p0rt1on
            # The Service below, by name. Instances are handed this inside their
            # audit webhook URL, so renaming the Service without changing this
            # breaks audit delivery silently — hence required, never defaulted.
            - name: P0RT1ON_K8S_MANAGER_SERVICE_NAME
              value: p0rt1on-manager
            # P0RT1ON_PANTRY is the StorageClass every portion's data PVC is provisioned from (see pantry.yaml); tailscale state uses the cluster default instead, so it stays off the pantry.
            - name: P0RT1ON_PANTRY
              value: p0rt1on-pantry
            - name: P0RT1ON_DB_PATH
              value: /data/p0rt1on.db
            # Trust the cluster CA for API calls (Deno reads this PEM).
            - name: DENO_CERT
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            # Admin UI/API is loopback-only by design; reach it via `kubectl port-forward`, never expose it.
            - containerPort: 8080
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: p0rt1on-manager-data }
---
apiVersion: v1
kind: Service
metadata:
  name: p0rt1on-manager
  namespace: p0rt1on
spec:
  selector: { app: p0rt1on-manager }
  ports:
    - name: audit
      port: 8081
      targetPort: 8081
