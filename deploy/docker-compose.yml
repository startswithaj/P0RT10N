# Dev stack for p0rt1on. MinIO is the dependency the `mc` integration tests run
# against. The manager normally launches per-friend MinIO + tailscaled at
# runtime; this file provides a single shared MinIO for local dev / IT.
#
#   docker compose -f deploy/docker-compose.yml up -d minio
#   # then point mc at it and run the integration suite:
#   export P0RT1ON_INTEGRATION=1
#   export MINIO_ENDPOINT=http://127.0.0.1:9000
#   export MINIO_ROOT_USER=p0rtadmin MINIO_ROOT_PASSWORD=p0rtadmin123
#   deno task test:integration

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: p0rtadmin
      MINIO_ROOT_PASSWORD: p0rtadmin123
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console
    volumes:
      - minio-data:/data

  # The p0rt1on manager (web UI + API). Bundles `mc`. Local-only admin surface.
  manager:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DB_PATH: /data/p0rt1on.db
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - manager-data:/data
    depends_on:
      - minio

volumes:
  minio-data:
  manager-data:
