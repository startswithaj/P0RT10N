# p0rt1on manager. Runs the Deno app with bundled `mc` + docker CLIs, and
# launches the combined instance containers against the host's Docker daemon
# (socket mounted). Because the manager is itself a container, it reaches each
# instance's MinIO admin plane by CONTAINER NAME over the shared `p0rt1on-net`
# network (P0RT1ON_INSTANCE_ADDRESSING=network) — a loopback-published port is
# unreachable from another container. Instances POST the audit webhook back via
# the host gateway.
#
# The p0rt1on-net network is created out-of-band (shared with the instances the
# manager launches over the docker socket):
#   docker network create p0rt1on-net
#
# Needs a .env with at least P0RT1ON_MASTER_KEY,
# P0RT1ON_TAILSCALE_OAUTH_CLIENT_SECRET and P0RT1ON_TAILSCALE_TAILNET_DOMAIN.
services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile.dev # dev image: also runs the Vite dev server
    env_file: .env
    # Root so it can use the mounted docker socket + write the volumes.
    user: root
    environment:
      # Container overrides (the app's own defaults suit host-run dev).
      # The admin API binds loopback unconditionally; only the dedicated audit
      # webhook listener (fixed at 8081) faces the container network. Reach
      # instances by container name over p0rt1on-net (see networks below).
      P0RT1ON_INSTANCE_ADDRESSING: "network"
      P0RT1ON_DB_PATH: "/app/data/p0rt1on.db"
      # Forward every MinIO event to your own webhook (optional, byte-identical):
      # P0RT1ON_MINIO_FORWARD_URL: "https://example.com/minio-events"
      # P0RT1ON_MINIO_FORWARD_AUTHORIZATION: "Bearer your-token"
    ports:
      - "127.0.0.1:8080:8080" # admin API — loopback only (Vite proxies here)
      - "8081:8081" # audit webhook — instances POST via the host gateway
      - "127.0.0.1:5173:5173" # Vite dev server (frontend) — open this in a browser
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # launch instance containers
      - .:/app # live source (repo root = build context) — restart picks up code changes
      - p0rt1on-db:/app/data # metadata DB
      - p0rt1on-mc:/root/.mc # mc aliases (per-instance admin creds)
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host on Linux
    networks:
      - default # keep host-published admin/audit/Vite ports
      - p0rt1on-net # resolve p0rt1on-instance-<host> by container name
    restart: unless-stopped

volumes:
  p0rt1on-db:
  p0rt1on-mc:

networks:
  # The network instances join (DOCKER_NETWORK in DockerRuntime.ts). Created
  # out-of-band:
  #   docker network create p0rt1on-net
  p0rt1on-net:
    external: true
