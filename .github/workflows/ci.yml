name: CI

# PRs get fast, secretless checks. Merge to main (or a manual run) additionally
# runs the full integration suite, and the image build/publish is gated behind
# it — a red suite means no image is produced.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: static + unit + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.2" # match the Dockerfile's pinned Deno
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      # Read-only: fmt --check, lint, typecheck, unit tests, coverage gates.
      - run: deno task verify

  # ---------------------------------------------------------------------------
  # Integration tiers — only on merge to main / manual (skipped on PRs). Each
  # is a `needs` of `build`, so a failure blocks the image. They fail (never
  # skip) when their infra/config is absent, so a green job is a real run.
  # ---------------------------------------------------------------------------
  mc-integration:
    name: integration — mc ↔ MinIO
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=p0rtadmin -e MINIO_ROOT_PASSWORD=p0rtadmin123 \
            minio/minio:RELEASE.2025-04-08T15-41-24Z server /data
      - name: Build manager image + run the suite inside it (pinned mc)
        run: |
          docker build --target integration -t p0rt1on-manager:ci .
          docker run --rm --network host \
            -e MINIO_ENDPOINT=http://127.0.0.1:9000 \
            -e MINIO_ROOT_USER=p0rtadmin -e MINIO_ROOT_PASSWORD=p0rtadmin123 \
            --entrypoint deno p0rt1on-manager:ci \
            test --allow-read --allow-write --allow-env --allow-ffi --allow-net \
            --allow-run --unstable-ffi \
            integration-tests/McShellClient.integration.test.ts

  k8s:
    name: k8s e2e (secretless — k3d + in-cluster headscale)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.2" # tier1 runs `deno test` on the host as the SA
      - name: Install k3d + kubectl
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Build images + tier1 + tier2
        run: ./integration-tests/run-integration.sh

  docker-tailnet:
    name: docker portion — real tailnet
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      # The DEDICATED CI TAILNET — never a personal one. This job mints keys
      # and creates nodes, so its OAuth client must belong to a throwaway
      # tailnet. Missing config FAILS the suite (never skips) → blocks build.
      #
      # Only the OAuth client secret is a credential. The MagicDNS name and the
      # tag owner are public policy identifiers, so they are repo VARIABLES —
      # secrets are for things that grant access.
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILNET_DOMAIN: ${{ vars.TAILNET_DOMAIN }}
      # Who owns each friend tag in the CI tailnet's `tagOwners` — set it to
      # that tailnet's OAuth client tag (e.g. `tag:p0rt1on`). REQUIRED: the
      # client can only mint keys for tags it owns.
      TAILSCALE_TAG_OWNER: ${{ vars.TAILSCALE_TAG_OWNER }}
      ADMIN_USERNAME: p0rt1on-it
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.2"
      - name: Generate the throwaway manager's secrets
        # NOT repo secrets: this manager exists for one job on a loopback
        # port, and its master key only has to stay stable within the run.
        # Fewer stored secrets is the point.
        run: |
          KEY="$(openssl rand -hex 32)"; PW="$(openssl rand -hex 16)"
          echo "::add-mask::$KEY"; echo "::add-mask::$PW"
          echo "P0RT1ON_MASTER_KEY=$KEY" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Portion e2e over the real tailnet (builds all three images)
        # Proves what headscale structurally cannot: `tailscale serve` over
        # HTTPS with a real cert, and a friend backing up across the tailnet.
        run: ./integration-tests/run-docker-tailnet.sh

  # ---------------------------------------------------------------------------
  # Build + publish the images — ONLY if every check + integration tier passed.
  # Defaults to GHCR with the built-in GITHUB_TOKEN (no extra secret); swap the
  # registry/tags for your deploy target.
  # ---------------------------------------------------------------------------
  build:
    name: build + publish images
    if: ${{ github.event_name != 'pull_request' }}
    needs: [check, mc-integration, k8s, docker-tailnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: manager, context: . }
          - { name: instance, context: instance }
          - { name: backup-client, context: backup-client }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/p0rt1on-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/p0rt1on-${{ matrix.name }}:latest
