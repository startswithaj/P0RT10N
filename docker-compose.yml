# This file has no build target and does not run standalone; combine it with exactly one overlay (dev or prod).
# The manager reaches each instance's MinIO admin plane by container name over `p0rt1on-net`, since a loopback-published port is unreachable from another container.
services:
  manager:
    env_file: .env
    # Runs as root so it can use the mounted docker socket and write the volumes.
    user: root
    environment:
      P0RT1ON_INSTANCE_ADDRESSING: "network"
      P0RT1ON_DB_PATH: "/app/data/p0rt1on.db"
      # Forward every MinIO event to your own webhook (optional, byte-identical):
      # P0RT1ON_MINIO_FORWARD_URL: "https://example.com/minio-events"
      # P0RT1ON_MINIO_FORWARD_AUTHORIZATION: "Bearer your-token"
    ports:
      # Port 8080 is loopback-only: prod serves the SPA directly from Deno here, while dev's Vite server proxies to it.
      - "127.0.0.1:8080:8080"
      - "8081:8081" # Published (not loopback) so instances can POST the audit webhook via the host gateway.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - p0rt1on-db:/app/data
      - p0rt1on-mc:/root/.mc # mc aliases store per-instance admin credentials.
      # The pantry must be bind-mounted at the same path inside the manager as on the host, so the manager's friend directories and the instance containers' host-daemon bind mounts resolve to identical bytes; set P0RT1ON_PANTRY in .env.
      - ${P0RT1ON_PANTRY:-/srv/p0rt1on}:${P0RT1ON_PANTRY:-/srv/p0rt1on}
    extra_hosts:
      # host.docker.internal isn't defined on Linux by default; this makes it resolve to the host gateway.
      - "host.docker.internal:host-gateway"
    networks:
      - default # Keeps the host-published admin and audit ports reachable.
      - p0rt1on-net # Resolves p0rt1on-instance-<host> names by container name.
    restart: unless-stopped

volumes:
  p0rt1on-db:
  p0rt1on-mc:

networks:
  # p0rt1on-net is the network instance containers join (DOCKER_NETWORK in DockerRuntime.ts); since it's external, create it out-of-band first: `docker network create p0rt1on-net`.
  p0rt1on-net:
    external: true
