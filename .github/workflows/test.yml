name: test

on:
  workflow_call:

jobs:
  test:
    name: verify (fmt + lint + typecheck + unit + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4 # match the Dockerfile's pinned Deno

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-2.9.4-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json', 'app/packages/*/deno.json') }}
          restore-keys: |
            deno-2.9.4-${{ runner.os }}-

      - name: Print Deno version
        run: deno --version

      - name: Install dependencies (frozen lockfile)
        run: deno install --frozen

      # Panda's styled-system/ is generated and gitignored, so a clean checkout
      # has none of the client types verify typechecks against.
      - name: Generate Panda styled-system
        run: deno task --cwd app/packages/client prepare

      # Read-only: fmt --check, lint, typecheck (server + client), unit tests,
      # coverage gates. Never mutates the tree (that's check:all, run locally).
      - name: Run verify
        run: deno task verify
