# Each portion's data lands in its own sub-directory under the pantry path, kubelet-mounted into only that pod, the same per-instance isolation as the docker bind mount.
#
# Requires the local-path provisioner (k3s ships it; otherwise install rancher.io/local-path-provisioner).
# Tailscale node state doesn't use this StorageClass, so the pantry holds friend data only.
#
# reclaimPolicy Delete matches docker's `rm -rf`: offboarding deletes the PVC and the bytes with it, with no orphaned-PV recovery window; the offboard confirm-by-name and tombstone-after-teardown gates are the safety net.
# Switch to Retain if deletes should be manually reversible instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/srv/p0rt1on"]
        }
      ]
    }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: p0rt1on-pantry
provisioner: rancher.io/local-path
reclaimPolicy: Delete
# volumeBindingMode WaitForFirstConsumer binds the PV only once a pod needs it, so it lands on the node that runs the portion, since local-path volumes are node-local.
volumeBindingMode: WaitForFirstConsumer
